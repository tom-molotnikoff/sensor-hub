version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/sensor_hub"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/sensor_hub/ui/sensor_hub_ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/temperature_sensor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Ahead of pip-minor-and-patch: a dependency goes to the first group it matches.
      opentelemetry:
        applies-to: version-updates
        patterns: ["opentelemetry-*"]
      pip-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/sensor_hub/devstack/mocks"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        applies-to: version-updates
        patterns: ["opentelemetry-*"]
      pip-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
