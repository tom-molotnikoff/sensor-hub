version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/sensor_hub"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/sensor_hub/ui/sensor_hub_ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/temperature_sensor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # OpenTelemetry core (1.x) and contrib (0.x betas) pin each other exactly, so
      # they must move in one PR. Dependabot gives a dependency to its most specific
      # matching group and ranks a pattern-less group above "opentelemetry-*", so
      # pip-minor-and-patch has to exclude them explicitly.
      opentelemetry:
        applies-to: version-updates
        patterns: ["opentelemetry-*"]
      pip-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        exclude-patterns: ["opentelemetry-*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/sensor_hub/devstack/mocks"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # See the /temperature_sensor entry for why OpenTelemetry is excluded below.
      opentelemetry:
        applies-to: version-updates
        patterns: ["opentelemetry-*"]
      pip-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        exclude-patterns: ["opentelemetry-*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
